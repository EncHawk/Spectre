[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spectre-healer"
version = "0.1.0"
description = "A read-only-by-default self-healing loop for traced AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Spectre contributors" }]
dependencies = []

[project.optional-dependencies]
neatlogs = ["neatlogs>=0.7"]
openai = ["openai>=1.0"]
groq = ["groq>=0.9"]
anthropic = ["anthropic>=0.34"]
google = ["google-genai>=1.0"]
providers = ["openai>=1.0", "groq>=0.9", "anthropic>=0.34", "google-genai>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[project.scripts]
healer = "healer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/healer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
